version: '3'
services:
  api:
    container_name: api
    restart: always
    image: fabiopereirareis/githubactions-back
    ports:
      - 8080:8080
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  web:
    container_name: web
    restart: always
    image: fabiopereirareis/githubactions-front
    ports:
      - 8090:80
    depends_on:
      - api

  postgres:
    container_name: postgres
    restart: always
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c 'max_connections=200' && postgres -c 'shared_buffers=24MB'    
    environment:
      POSTGRES_DB: docker_db
      POSTGRES_USER: user_name
      POSTGRES_PASSWORD: password
    healthcheck:
      test: "exit 0"
    ports:
      - "5432:5432"

volumes:
  postgres_data: